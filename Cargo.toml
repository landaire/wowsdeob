[package]
name = "wowsdeob"
version = "0.1.0"
authors = ["Lander Brandt <lander@conficker.io>"]
edition = "2024"

[dependencies]
py27-marshal = { version = "0.6" }
base64 = "0.13"
thiserror = "1.0"
flate2 = "1.0"
pydis = "0.6"
unfuck = { git = "https://github.com/landaire/unfuck", rev = "1edae2c77632bc660e7c0dc8aca7b75d5995c933", default-features = false }
num-bigint = "0.4"
log = "0.4"
num-traits = "0.2"

zip = { version = "0.6", optional = true }
structopt = { version = "0.3", optional = true }
memmap = { version = "0.7", optional = true }
anyhow = { version = "1.0", optional = true }
simple_logger = { version = "2.3", optional = true }
csv = { version = "1.1", optional = true }
rayon = { version = "1.5", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["cli"]
cli = ["dep:zip", "dep:structopt", "dep:memmap", "dep:anyhow", "dep:simple_logger", "dep:csv", "dep:rayon", "dep:serde_json"]
reduced_functionality = []

[[bin]]
name = "wowsdeob"
path = "src/main.rs"
required-features = ["cli"]
