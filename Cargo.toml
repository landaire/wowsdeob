[package]
name = "wowsdeob"
version = "0.1.0"
authors = ["Lander Brandt <lander@conficker.io>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/landaire/wowsdeob"

[dependencies]
py27-marshal = { version = "0.6" }
base64 = "0.13"
thiserror = "1.0"
flate2 = "1.0"
pydis = "0.6"
unfuck = { git = "https://github.com/landaire/unfuck", rev = "0178cebce61c906140423c2fc5a00989544edc6c", default-features = false }
num-bigint = "0.4"
log = "0.4"
num-traits = "0.2"

zip = { version = "8.6", default-features = false, features = ["deflate"], optional = true }
memchr = { version = "2.8", optional = true }
structopt = { version = "0.3", optional = true }
memmap = { version = "0.7", optional = true }
anyhow = { version = "1.0", optional = true }
simple_logger = { version = "2.3", optional = true }
csv = { version = "1.1", optional = true }
rayon = { version = "1.5", optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = ["cli"]
cli = ["constants", "zip/bzip2", "zip/zstd", "dep:structopt", "dep:memmap", "dep:anyhow", "dep:simple_logger", "dep:csv", "dep:rayon", "dep:serde_json"]
# Runs the client scripts in unfuck's interpreter to produce constants.json.
constants = ["dep:zip", "dep:memchr"]
reduced_functionality = []

[[bin]]
name = "wowsdeob"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "constants_install"
required-features = ["constants"]
